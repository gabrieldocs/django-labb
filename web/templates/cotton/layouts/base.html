{% load static %}
{% load lb_tags %}
<!DOCTYPE html>
<html lang="en" {% labb_theme %}>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Welcome to labb" }}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'web/img/labb/favicon/favicon.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'web/img/labb/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'web/img/labb/favicon/favicon-16x16.png' %}">
    <link rel="shortcut icon" href="{% static 'web/img/labb/favicon/favicon.ico' %}">
    <link rel="manifest" href="{% static 'web/img/labb/favicon/site.webmanifest' %}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <c-lb.m.dependencies setThemeEndpoint="{% url 'web:set_theme' %}" />
</head>

<body class="min-h-screen bg-base-100 text-base-content grainy-bg antialiased"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <nav class="navbar bg-base-100 border-b border-base-200 px-6 justify-between">
        <!-- Brand Logo / Name -->
        <a href="{% url 'todo:task_list' %}" class="text-xl font-bold tracking-tight flex items-center gap-2">
            <span>📝</span> TaskFlow
        </a>

        <!-- User Menu / Actions -->
        <div class="flex items-center gap-4">
            {% if user.is_authenticated %}
            <span class="text-sm opacity-70">Hello, <strong>{{ user.username }}</strong></span>

            <!-- Logout Form (POST required in modern Django) -->
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <c-lb.button type="submit" variant="ghost" size="sm">
                    Log Out
                </c-lb.button>
            </form>
            {% else %}
            <a href="{% url 'login' %}">
                <c-lb.button variant="primary" size="sm">Log In</c-lb.button>
            </a>
            {% endif %}
        </div>
    </nav>
    {% csrf_token %}
    {{ slot }}
</body>

</html>
