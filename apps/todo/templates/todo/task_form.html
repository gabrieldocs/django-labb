<c-layouts.base>
<div class="max-w-md mx-auto p-6">
  <c-lb.card class="bg-base-100 p-3 shadow-lg border border-base-200">
    <h2 class="text-xl font-bold mb-4">{{ title }}</h2>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <!-- Title Input -->
      <div>
        <label class="label"><span class="label-text">Task Title</span></label>
        {{ form.title }}
        {% if form.title.errors %}
          <p class="text-error text-xs mt-1">{{ form.title.errors.0 }}</p>
        {% endif %}
      </div>

      <!-- Description Input -->
      <div>
        <label class="label"><span class="label-text">Description</span></label>
        {{ form.description }}
      </div>

      <!-- Completed Checkbox (only show on edit) -->
      {% if form.completed %}
        <div class="form-control">
          <label class="label cursor-pointer justify-start gap-3">
            {{ form.completed }}
            <span class="label-text">Mark as Completed</span>
          </label>
        </div>
      {% endif %}

      <!-- Form Buttons -->
      <div class="flex justify-end gap-2 mt-6">
        <a href="{% url 'todo:task_list' %}">
          <c-lb.button variant="ghost" type="button">Cancel</c-lb.button>
        </a>
        <c-lb.button variant="primary" type="submit">Save Task</c-lb.button>
      </div>
    </form>
  </c-lb.card>
</div>
</c-layouts.base>
