<c-layouts.base>
<div class="max-w-md mx-auto p-6">
  <c-lb.card class="bg-base-100 shadow-lg border border-base-200">
    <h2 class="text-xl font-bold text-error mb-2">Delete Task?</h2>
    <p class="mb-6">Are you sure you want to delete <strong>"{{ task.title }}"</strong>? This action cannot be undone.</p>

    <form method="post" class="flex justify-end gap-2">
      {% csrf_token %}
      <a href="{% url 'todo:task_list' %}">
        <c-lb.button variant="ghost" type="button">Cancel</c-lb.button>
      </a>
      <c-lb.button variant="error" type="submit">Yes, Delete</c-lb.button>
    </form>
  </c-lb.card>
</div>
</c-layouts.base>
