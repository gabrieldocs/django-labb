<div id="schedule-{{ schedule.pk }}" class="mt-2 border border-gray-100 p-2">
    <h1 class="text-2xl font-bold">{{ schedule.title }}</h1>
    {% if schedule.description %}
    <p class="text-gray-500">{{ schedule.description }}</p>

    <ol>
        {% for task in schedule.tasks.all %}
        <li class="text-sm mt-2 mb-2 text-purple-500">{{ task.title }}</li>
        {% endfor %}
    </ol>
    {% endif %}
    <a href="{% url 'schedule:schedule_show' schedule.id %}">
        <c-lb.button variant="primary">See details</c-bl.button>
    </a>
</div>
